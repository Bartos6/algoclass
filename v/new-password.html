<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowe hasło – AlgoClass</title><link rel="stylesheet" href="css/style.css"><script defer src="js/supabase-config.js"></script><script defer src="js/cloud.js"></script></head><body><main class="auth-page"><section class="auth-card"><h1>Ustaw nowe hasło</h1><form id="changePassword"><div class="field"><label for="newPass">Nowe hasło (min. 8 znaków)</label><input id="newPass" type="password" minlength="8" autocomplete="new-password" required></div><button class="primary-button">Zapisz hasło</button></form><p id="passwordInfo" aria-live="polite"></p><p><a href="index.html">Wróć do logowania</a></p></section></main><script>document.getElementById('changePassword').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('passwordInfo');try{const db=await AlgoCloud.connect();if(!db)throw Error('Najpierw skonfiguruj Supabase.');const {error}=await db.auth.updateUser({password:document.getElementById('newPass').value});if(error)throw error;p.textContent='Hasło zostało zmienione.'}catch(err){p.textContent=err.message}};</script></body></html>
