<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset hasła | AlgoClass</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js" defer></script>
</head>
<body>
  <button class="theme-toggle" type="button" data-theme-toggle aria-label="Zmień motyw">🌙</button>

  <main class="auth-page">
    <section class="auth-card">
      <a class="brand" href="index.html">AlgoClass</a>
      <p class="subtitle">Reset hasła</p>

      <form id="resetForm">
        <div class="field">
          <label for="email">Adres e-mail</label>
          <input id="email" type="email" autocomplete="email"
                 placeholder="uczen@szkola.pl" required>
        </div>
        <button class="primary-button" type="submit">Wyślij link resetujący</button>
        <p id="resetMessage" class="form-message" aria-live="polite"></p>
      </form>

      <div class="auth-links">
        <a href="index.html">← Powrót do logowania</a>
      </div>

      <p class="demo-note">Wysyłanie wiadomości e-mail zostanie podłączone wraz z backendem.</p>
    </section>
  </main>

  <script>
    document.getElementById("resetForm").addEventListener("submit", function (event) {
      event.preventDefault();
      const message = document.getElementById("resetMessage");
      message.textContent = "Formularz działa. Wysyłkę e-mail podłączymy później.";
      message.className = "form-message info";
    });
  </script>
</body>
</html>
