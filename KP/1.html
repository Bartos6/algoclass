<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zostań komputerem — C++</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#142b4d;color:white;padding:28px max(18px,calc((100vw - 1100px)/2))}h1{margin:0 0 6px}header p{margin:0;color:#d8e4f7}main{max-width:1100px;margin:24px auto;padding:0 16px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}button,select{border:1px solid #bdcbe0;border-radius:9px;padding:10px 14px;font:inherit;background:white;cursor:pointer}button.primary{background:#2459a6;color:white;border-color:#2459a6}button:hover{filter:brightness(.96)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.tile,.sheet{background:white;border:1px solid #dce3ed;border-radius:12px;padding:18px}.tile h3{margin:8px 0}.tag{font-size:12px;color:#375e9b;font-weight:700}.sheet{margin:20px 0;padding:24px}.sheet h2{margin-top:0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}pre{background:#101c2d;color:#e7f2ff;border-radius:9px;padding:18px;overflow:auto;line-height:1.55;font-size:14px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #cbd5e1;padding:6px;text-align:left}th{background:#e9f0f9}td input{width:100%;min-width:50px;padding:8px;border:1px solid #d0d8e4;border-radius:5px}td:first-child{min-width:120px}.hint{font-size:13px;color:#52647e}.answer{background:#eff8f0;border:1px solid #b6d7bd;border-radius:8px;padding:12px;margin-top:12px}.bad{color:#a32b2b}.good{color:#1c723d}.output{width:100%;padding:10px;border:1px solid #b9c6d9;border-radius:8px}details{margin:10px 0}footer{padding:20px;text-align:center;color:#52647e}@media(max-width:760px){.layout{grid-template-columns:1fr}.sheet{padding:14px}}@media print{header,.toolbar,.cards,.actions,footer,details,.answer{display:none!important}body{background:white}.sheet{border:0;break-after:page;margin:0;padding:0}.layout{grid-template-columns:1fr 1fr}pre{color:black;background:#f1f1f1;white-space:pre-wrap}.sheet input{border:0;border-bottom:1px solid #777;border-radius:0}.sheet h2{font-size:20px}button{display:none}}
</style></head><body><header><h1>🧠 Zostań komputerem — C++</h1><p>Warunki i pętle while • śledzenie pamięci krok po kroku</p></header><main><div class="toolbar"><label>Poziom: <select id="filter"><option value="all">Wszystkie</option><option value="Podstawowy">Podstawowy</option><option value="Średni">Średni</option><option value="Rozszerzony">Rozszerzony</option></select></label><button onclick="window.print()">🖨️ Drukuj widoczne karty</button><button onclick="resetAll()">Wyczyść odpowiedzi</button></div><div class="cards" id="cards"></div><div id="sheets"></div></main><footer>Wszystkie obliczenia są sprawdzane lokalnie w przeglądarce. Bez kont i przesyłania odpowiedzi.</footer>
<script>
'use strict';
// Każdy wiersz tabeli to kolejny istotny moment wykonania programu.
// values: stan pamięci po kroku, cond: wynik sprawdzonego warunku (T/N lub —).
const tasks=[
{id:1,title:'Dwa niezależne warunki',level:'Podstawowy',input:'4 8',code:`int a, b, c;\ncin >> a >> b;\nc = a + b;\nif (c > 10) {\n    a = a * 2;\n}\nif (a < b) {\n    b = b + 5;\n}\ncout << a << " " << b << " " << c;`,vars:['a','b','c'],steps:[['cin >> a >> b',[4,8,'—'],'—'],['c = a + b',[4,8,12],'—'],['c > 10',[4,8,12],'T'],['a = a * 2',[8,8,12],'—'],['a < b',[8,8,12],'N']],output:'8 8 12',question:'Dlaczego druga instrukcja if nie zmieniła b?'},
{id:2,title:'if / else',level:'Podstawowy',input:'7 3',code:`int x, y;\ncin >> x >> y;\nif (x % 2 == 0) {\n    y = y + x;\n} else {\n    x = x - y;\n}\ncout << x << " " << y;`,vars:['x','y'],steps:[['cin >> x >> y',[7,3],'—'],['x % 2 == 0',[7,3],'N'],['x = x - y',[4,3],'—']],output:'4 3',question:'Która gałąź zostanie wykonana dla x = 8?'},
{id:3,title:'Warunek złożony',level:'Średni',input:'5 12',code:`int a, b;\ncin >> a >> b;\nif (a > 0 && b % 3 == 0) {\n    a += 2;\n}\nif (a == 7 || b < 10) {\n    b -= a;\n}\ncout << a << " " << b;`,vars:['a','b'],steps:[['cin >> a >> b',[5,12],'—'],['a > 0 && b % 3 == 0',[5,12],'T'],['a += 2',[7,12],'—'],['a == 7 || b < 10',[7,12],'T'],['b -= a',[7,5],'—']],output:'7 5',question:'Jak różnią się operatory && oraz ||?'},
{id:4,title:'Zagnieżdżone if',level:'Średni',input:'-3',code:`int x, wynik = 0;\ncin >> x;\nif (x != 0) {\n    if (x < 0) {\n        wynik = -x;\n    } else {\n        wynik = x * 2;\n    }\n}\ncout << wynik;`,vars:['x','wynik'],steps:[['cin >> x',[-3,0],'—'],['x != 0',[-3,0],'T'],['x < 0',[-3,0],'T'],['wynik = -x',[-3,3],'—']],output:'3',question:'Co zostanie wypisane dla x = 0?'},
{id:5,title:'while — licznik',level:'Podstawowy',input:'4',code:`int n, i = 1;\ncin >> n;\nwhile (i <= n) {\n    cout << i << " ";\n    i++;\n}`,vars:['n','i'],steps:[['cin >> n',[4,1],'—'],['i <= n (1)',[4,1],'T'],['i++ (1)',[4,2],'—'],['i <= n (2)',[4,2],'T'],['i++ (2)',[4,3],'—'],['i <= n (3)',[4,3],'T'],['i++ (3)',[4,4],'—'],['i <= n (4)',[4,4],'T'],['i++ (4)',[4,5],'—'],['i <= n (5)',[4,5],'N']],output:'1 2 3 4',question:'Ile razy sprawdzono warunek while?'},
{id:6,title:'while — suma parzystych',level:'Średni',input:'6',code:`int n, suma = 0;\ncin >> n;\nwhile (n > 0) {\n    if (n % 2 == 0) {\n        suma += n;\n    }\n    n--;\n}\ncout << suma;`,vars:['n','suma'],steps:(()=>{let a=[['cin >> n',[6,0],'—']],n=6,s=0;while(n>0){a.push([`n > 0 (n=${n})`,[n,s],'T']);a.push([`n % 2 == 0 (n=${n})`,[n,s],n%2===0?'T':'N']);if(n%2===0){s+=n;a.push(['suma += n',[n,s],'—']);}n--;a.push(['n--',[n,s],'—']);}a.push(['n > 0 (koniec)',[0,s],'N']);return a})(),output:'12',question:'Co zmieni się, gdy input będzie równy 5?'},
{id:7,title:'while — wartownik',level:'Średni',input:'3 5 -2 0',code:`int x, suma = 0;\ncin >> x;\nwhile (x != 0) {\n    suma += x;\n    cin >> x;\n}\ncout << suma;`,vars:['x','suma'],steps:[['cin >> x',[3,0],'—'],['x != 0 (1)',[3,0],'T'],['suma += x',[3,3],'—'],['cin >> x',[5,3],'—'],['x != 0 (2)',[5,3],'T'],['suma += x',[5,8],'—'],['cin >> x',[-2,8],'—'],['x != 0 (3)',[-2,8],'T'],['suma += x',[-2,6],'—'],['cin >> x',[0,6],'—'],['x != 0 (4)',[0,6],'N']],output:'6',question:'Czy liczba 0 jest dodawana do sumy?'},
{id:8,title:'while + if — licznik cyfr',level:'Rozszerzony',input:'5072',code:`int n, ile = 0;\ncin >> n;\nwhile (n > 0) {\n    int cyfra = n % 10;\n    if (cyfra % 2 == 0) {\n        ile++;\n    }\n    n /= 10;\n}\ncout << ile;`,vars:['n','ile','cyfra'],steps:[['cin >> n',[5072,0,'—'],'—'],['n > 0',[5072,0,'—'],'T'],['cyfra = n % 10',[5072,0,2],'—'],['cyfra % 2 == 0',[5072,0,2],'T'],['ile++',[5072,1,2],'—'],['n /= 10',[507,1,2],'—'],['n > 0',[507,1,2],'T'],['cyfra = n % 10',[507,1,7],'—'],['cyfra % 2 == 0',[507,1,7],'N'],['n /= 10',[50,1,7],'—'],['n > 0',[50,1,7],'T'],['cyfra = n % 10',[50,1,0],'—'],['cyfra % 2 == 0',[50,1,0],'T'],['ile++',[50,2,0],'—'],['n /= 10',[5,2,0],'—'],['n > 0',[5,2,0],'T'],['cyfra = n % 10',[5,2,5],'—'],['cyfra % 2 == 0',[5,2,5],'N'],['n /= 10',[0,2,5],'—'],['n > 0',[0,2,5],'N']],output:'2',question:'Dlaczego 0 jest tutaj cyfrą parzystą?'},
{id:9,title:'Zagnieżdżone while',level:'Rozszerzony',input:'3',code:`int n, i = 1, wynik = 0;\ncin >> n;\nwhile (i <= n) {\n    int j = 1;\n    while (j <= i) {\n        wynik++;\n        j++;\n    }\n    i++;\n}\ncout << wynik;`,vars:['n','i','j','wynik'],steps:[['cin >> n',[3,1,'—',0],'—'],['i <= n (i=1)',[3,1,'—',0],'T'],['j = 1',[3,1,1,0],'—'],['j <= i',[3,1,1,0],'T'],['wynik++',[3,1,1,1],'—'],['j++',[3,1,2,1],'—'],['j <= i',[3,1,2,1],'N'],['i++',[3,2,2,1],'—'],['i <= n (i=2)',[3,2,2,1],'T'],['j = 1',[3,2,1,1],'—'],['j <= i',[3,2,1,1],'T'],['wynik++',[3,2,1,2],'—'],['j++',[3,2,2,2],'—'],['j <= i',[3,2,2,2],'T'],['wynik++',[3,2,2,3],'—'],['j++',[3,2,3,3],'—'],['j <= i',[3,2,3,3],'N'],['i++',[3,3,3,3],'—'],['i <= n (i=3)',[3,3,3,3],'T'],['j = 1',[3,3,1,3],'—'],['j <= i',[3,3,1,3],'T'],['wynik++',[3,3,1,4],'—'],['j++',[3,3,2,4],'—'],['j <= i',[3,3,2,4],'T'],['wynik++',[3,3,2,5],'—'],['j++',[3,3,3,5],'—'],['j <= i',[3,3,3,5],'T'],['wynik++',[3,3,3,6],'—'],['j++',[3,3,4,6],'—'],['j <= i',[3,3,4,6],'N'],['i++',[3,4,4,6],'—'],['i <= n (koniec)',[3,4,4,6],'N']],output:'6',question:'Ile razy wykona się wynik++ dla n = 4?'},
{id:10,title:'Znajdź błąd — pętla nieskończona',level:'Rozszerzony',input:'3',code:`int x;\ncin >> x;\nwhile (x > 0) {\n    cout << x << " ";\n    x++;\n}`,vars:['x'],steps:[['cin >> x',[3],'—'],['x > 0 (1)',[3],'T'],['x++ (1)',[4],'—'],['x > 0 (2)',[4],'T'],['x++ (2)',[5],'—'],['x > 0 (3)',[5],'T'],['x++ (3)',[6],'—']],output:'3 4 5 ...',question:'Dlaczego pętla nie kończy się normalnie? Popraw jedną instrukcję.',note:'Przy typie int kolejne zwiększanie w końcu powoduje przepełnienie ze znakiem (niezdefiniowane zachowanie w C++). Zapis OUTPUT pokazuje tylko początek strumienia; program nie ma gwarantowanego końcowego wyniku.'}
];
const cards=document.getElementById('cards'),sheets=document.getElementById('sheets');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const level=document.getElementById('filter').value;cards.innerHTML='';sheets.innerHTML='';tasks.filter(t=>level==='all'||t.level===level).forEach(t=>{const tile=document.createElement('div');tile.className='tile';tile.innerHTML=`<span class="tag">KARTA ${t.id} • ${esc(t.level)}</span><h3>${esc(t.title)}</h3><button class="primary" onclick="document.getElementById('task-${t.id}').scrollIntoView({behavior:'smooth'})">Otwórz kartę ↓</button>`;cards.append(tile);const section=document.createElement('section');section.className='sheet';section.id=`task-${t.id}`;const headers=t.vars.map(v=>`<th>${esc(v)}</th>`).join('');const trs=t.steps.map((s,i)=>`<tr><td>${i+1}. ${esc(s[0])}</td>${t.vars.map((v,j)=>`<td><input aria-label="Karta ${t.id}, krok ${i+1}, ${v}" data-id="${t.id}" data-r="${i}" data-c="${j}" autocomplete="off" placeholder="—"></td>`).join('')}<td><input aria-label="Karta ${t.id}, warunek w kroku ${i+1}" data-id="${t.id}" data-r="${i}" data-c="cond" autocomplete="off" placeholder="—"></td></tr>`).join('');section.innerHTML=`<h2>Karta ${t.id}. ${esc(t.title)}</h2><p><b>Poziom:</b> ${esc(t.level)} • <b>INPUT:</b> <code>${esc(t.input)}</code></p><div class="layout"><div><h3>Kod C++ (fragment funkcji main)</h3><pre><code>${esc(t.code)}</code></pre><p class="hint">Wpisz stan wszystkich zmiennych po wskazanym kroku. „—” oznacza brak wartości / nieutworzoną zmienną. W kolumnie Warunek wpisz T, N albo —. Pominięte instrukcje nie mają osobnych wierszy.</p><p><b>Pytanie:</b> ${esc(t.question)}</p><textarea class="output" rows="2" id="explain-${t.id}" placeholder="Twoja odpowiedź na pytanie..."></textarea></div><div><h3>Pamięć komputera</h3><div style="overflow:auto"><table><thead><tr><th>Wykonany krok / sprawdzenie</th>${headers}<th>Warunek T/N/—</th></tr></thead><tbody>${trs}</tbody></table></div><p><b>OUTPUT:</b></p><input class="output" id="out-${t.id}" placeholder="Wpisz wynik programu" autocomplete="off"><div class="actions toolbar"><button class="primary" onclick="check(${t.id})">Sprawdź</button><button onclick="solution(${t.id})">Pokaż rozwiązanie</button><button onclick="clearTask(${t.id})">Wyczyść kartę</button></div><div id="feedback-${t.id}" aria-live="polite"></div></div></div>`;sheets.append(section);});}
function normalize(v){return String(v).trim().replace(/\s+/g,' ').toUpperCase().replace(/^TAK$/,'T').replace(/^NIE$/,'N').replace(/^[–—-]$/,'—')}
function check(id){const t=tasks.find(x=>x.id===id);let ok=0,total=0;document.querySelectorAll(`[data-id="${id}"]`).forEach(el=>{const r=Number(el.dataset.r),c=el.dataset.c,expected=c==='cond'?t.steps[r][2]:t.steps[r][1][Number(c)];const good=normalize(el.value)===normalize(expected);el.style.borderColor=good?'#21965a':'#cb4242';total++;if(good)ok++});const out=document.getElementById(`out-${id}`);const outputOK=normalize(out.value)===normalize(t.output);out.style.borderColor=outputOK?'#21965a':'#cb4242';document.getElementById(`feedback-${id}`).innerHTML=`<p class="${ok===total&&outputOK?'good':'bad'}">Poprawne pola: ${ok}/${total}. OUTPUT: ${outputOK?'poprawny':'do poprawy'}.</p>${t.note?`<p class="hint">${esc(t.note)}</p>`:''}`}
function solution(id){const t=tasks.find(x=>x.id===id);document.querySelectorAll(`[data-id="${id}"]`).forEach(el=>{const c=el.dataset.c;el.value=c==='cond'?t.steps[Number(el.dataset.r)][2]:t.steps[Number(el.dataset.r)][1][Number(c)];el.style.borderColor='#21965a'});document.getElementById(`out-${id}`).value=t.output;document.getElementById(`feedback-${id}`).innerHTML=`<div class="answer"><b>Rozwiązanie pokazane.</b> Stan pamięci i OUTPUT zostały uzupełnione.${t.note?`<p>${esc(t.note)}</p>`:''}</div>`}
function clearTask(id){document.querySelectorAll(`[data-id="${id}"]`).forEach(el=>{el.value='';el.style.borderColor=''});document.getElementById(`out-${id}`).value='';document.getElementById(`out-${id}`).style.borderColor='';document.getElementById(`explain-${id}`).value='';document.getElementById(`feedback-${id}`).innerHTML=''}
function resetAll(){tasks.forEach(t=>{if(document.getElementById(`out-${t.id}`))clearTask(t.id)})}
document.getElementById('filter').addEventListener('change',render);render();
</script></body></html>
